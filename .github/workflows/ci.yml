name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks and tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            max-jobs = 1
            cores = 2

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'flake.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
          gc-max-store-size: 5G

      - name: Evaluate flakes for all supported platforms
        run: nix flake check --all-systems --no-build --no-update-lock-file

      - name: Build pinned development environment
        # Keep the shell's closure rooted when the cache action collects garbage.
        run: nix build .#devShells.x86_64-linux.default --no-update-lock-file --out-link "$RUNNER_TEMP/ursula-zig-shell"

      - name: Check formatting, build, and run Debug unit tests
        run: nix develop --no-update-lock-file --command just check

      - name: Run Debug integration tests
        run: nix develop --no-update-lock-file --command just test integration

      - name: Run ReleaseSafe unit tests
        run: |
          nix develop --no-update-lock-file --command \
            zig build test -Doptimize=ReleaseSafe -Dverbose-tests 2>&1 | cat

      - name: Run ReleaseSafe integration tests
        run: nix develop --no-update-lock-file --command zig build test-integration -Doptimize=ReleaseSafe
